name: Email Spam Detection CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install spaCy language model
        run: |
          python -m spacy download en_core_web_sm

      - name: Verify Python compilation
        run: |
          python -m compileall src main.py

      - name: Run email parser test
        run: |
          python -m src.data.test_email_parser

      - name: Run classifier test
        run: |
          python -m src.utils.test_classifier